# 在业务 Compose 之上按需装配外部追踪、存储和可视化服务。

services:
  minio-init:
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 admin 12345678 &&
                  mc mb --ignore-existing local/knowledge-files &&
                  mc mb --ignore-existing local/langfuse"

  ai:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
    depends_on:
      otel-collector:
        condition: service_started

  backend:
    environment:
      OTEL_ENABLED: "true"
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}

  # ---------- OpenTelemetry Collector（决策文档 §3.3 / §5.13.7 第 4 条）----------
  # RAG 阶段埋点的落点：AI 服务按 OTLP/HTTP 发到这里，再由 collector 转 debug(stdout) + file(JSONL)。
  otel-collector:
    # 钉版本：与本项目其余镜像钉版本习惯一致，避免 :latest 不可复现（决策文档 §6.2 第 6 项）
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: ekip-otel-collector
    restart: on-failure
    command: ["--config=/etc/otelcol/config.yaml"]
    # Collector 在此显式方案中向 Langfuse 导出；凭据只通过环境注入。
    environment:
      LANGFUSE_BASIC_AUTH: ${LANGFUSE_BASIC_AUTH:?Configure LANGFUSE_BASIC_AUTH before enabling observability}
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./logs/otel:/out
    # 4318 = OTLP/HTTP（应用在用）；4317 = OTLP/gRPC（留给将来直连的方案）
    ports: ["4318:4318", "4317:4317"]

  # ---------- 自托管 Langfuse（决策文档 §3.3 / §6.2 第 5 项）----------
  # 落点链路：ai → otel-collector → otlphttp/langfuse → langfuse-web(/api/public/otel)
  # → BullMQ(redis) → langfuse-worker → ClickHouse。复用本项目 postgres / redis / minio，
  # 只新增 clickhouse + web + worker 三件套。
  # 镜像钉版本：Langfuse v4（官方 compose 当前主线；决策文档写的「v3 自托管」同一条升级线）。
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: ekip-clickhouse
    restart: on-failure
    # 官方 compose 用非 root 101:101（25.x 起 ClickHouse 镜像默认拒绝 root）
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    # 不映射宿主端口：仅供 compose 网络内 langfuse-web/worker 访问，缩小暴露面。
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 1s

  langfuse-web:
    # 镜像官方发布在 Docker Hub（docker.langfuse.com 只是 Reo 的代理端点，本机直连该域名
    # 会走 IPv6/DNS 卡死），故直接钉 Docker Hub 的 langfuse/langfuse:4。
    image: docker.io/langfuse/langfuse:4
    container_name: ekip-langfuse-web
    restart: on-failure
    depends_on:
      minio-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    ports: ["3000:3000"]
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Configure LANGFUSE_NEXTAUTH_SECRET before enabling observability}
      SALT: ${LANGFUSE_SALT:?Configure LANGFUSE_SALT before enabling observability}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Configure LANGFUSE_ENCRYPTION_KEY before enabling observability}
      # 复用项目 postgres，但用独立库 langfuse（避免污染业务库 knowledge；库需预先 CREATE）
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/langfuse
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      # 单节点 ClickHouse：必须显式 false，否则迁移会走 ON CLUSTER + ReplicatedMergeTree，
      # 而单机没配 Zookeeper，直接报 code:139 起不来。
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_CLUSTER_NAME: default
      # 复用项目 redis（无密码），REDIS_AUTH 置空
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ""
      # 复用项目 minio（admin / 12345678，桶 langfuse 由 minio-init 建）
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "12345678"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "12345678"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # headless 初始化：预建 org/project/user + API key（collector 用这对 key 做 OTLP Basic 认证）
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    container_name: ekip-langfuse-worker
    restart: on-failure
    depends_on:
      minio-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      <<: *langfuse-env

volumes:
  clickhouse_data:
  clickhouse_logs:
